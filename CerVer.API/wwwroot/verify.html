<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificate Verification - CerVer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 50px auto;
        }

        .verification-card {
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

            input:focus {
                outline: none;
                border-color: #667eea;
            }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

            button:hover {
                transform: translateY(-2px);
            }

        .result {
            margin-top: 30px;
            padding: 20px;
            border-radius: 8px;
            display: none;
        }

            .result.valid {
                display: block;
                background: #d4edda;
                border: 1px solid #c3e6cb;
                color: #155724;
            }

            .result.invalid {
                display: block;
                background: #f8d7da;
                border: 1px solid #f5c6cb;
                color: #721c24;
            }

        .certificate-details {
            margin-top: 15px;
        }

        .detail-row {
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }

        .detail-label {
            font-weight: bold;
            display: inline-block;
            width: 120px;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
        }

        .status-active {
            background: #28a745;
            color: white;
        }

        .status-expired {
            background: #dc3545;
            color: white;
        }

        .loading {
            text-align: center;
            margin-top: 20px;
            display: none;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="verification-card">
            <h1>🔐 Certificate Verification</h1>
            <div class="subtitle">Verify the authenticity of any certificate</div>

            <div class="input-group">
                <label for="certNumber">Enter Certificate Number:</label>
                <input type="text" id="certNumber" placeholder="e.g., CERT-20241215-123456" />
            </div>

            <button onclick="verifyCertificate()">Verify Certificate</button>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p style="text-align: center; margin-top: 10px;">Verifying...</p>
            </div>

            <div id="result" class="result"></div>
        </div>
    </div>

    <script>
        // API base URL (change to your actual API URL)
        const API_BASE_URL = 'https://localhost:7000';

        async function verifyCertificate() {
            const certNumber = document.getElementById('certNumber').value.trim();

            if (!certNumber) {
                alert('Please enter a certificate number');
                return;
            }

            // Show loading
            document.getElementById('loading').style.display = 'block';
            document.getElementById('result').className = 'result';
            document.getElementById('result').style.display = 'none';

            try {
                const response = await fetch(`${API_BASE_URL}/api/certificates/verify-details/${certNumber}`);
                const data = await response.json();

                displayResult(data);
            } catch (error) {
                console.error('Error:', error);
                displayError('Network error. Please try again.');
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        function displayResult(data) {
            const resultDiv = document.getElementById('result');

            if (data.valid) {
                resultDiv.className = 'result valid';
                resultDiv.innerHTML = `
                    <h3>✅ Certificate is VALID</h3>
                    <div class="certificate-details">
                        <div class="detail-row">
                            <span class="detail-label">Certificate #:</span>
                            <span>${data.certificateNumber}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Serial #:</span>
                            <span>${data.serialNumber}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Issued To:</span>
                            <span>${data.fullName}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Membership:</span>
                            <span>${data.membershipTitle}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Issue Date:</span>
                            <span>${new Date(data.issueDate).toLocaleDateString()}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Expiry Date:</span>
                            <span>${new Date(data.expiryDate).toLocaleDateString()}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Status:</span>
                            <span class="status-badge status-active">${data.status}</span>
                        </div>
                    </div>
                `;
            } else {
                resultDiv.className = 'result invalid';
                resultDiv.innerHTML = `
                    <h3>❌ Certificate is INVALID</h3>
                    <p>${data.message || 'This certificate could not be verified.'}</p>
                    ${data.certificateNumber ? `
                        <div class="certificate-details">
                            <div class="detail-row">
                                <span class="detail-label">Certificate #:</span>
                                <span>${data.certificateNumber}</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">Status:</span>
                                <span class="status-badge status-expired">${data.status || 'INVALID'}</span>
                            </div>
                        </div>
                    ` : ''}
                `;
            }

            resultDiv.style.display = 'block';
        }

        function displayError(message) {
            const resultDiv = document.getElementById('result');
            resultDiv.className = 'result invalid';
            resultDiv.innerHTML = `
                <h3>❌ Verification Failed</h3>
                <p>${message}</p>
            `;
            resultDiv.style.display = 'block';
        }

        // Allow Enter key to submit
        document.getElementById('certNumber').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                verifyCertificate();
            }
        });
    </script>
</body>
</html>
